<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 5 - To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="todo">
        <h2>Daftar Tugas Kuliah</h2>
        <form id="formTugas">
            <input type="text" id="inputTugas" placeholder="Tulis tugas baru...">
            <button type="submit">Tambah</button>
        </form>
        <ul id="daftar"></ul>
        <div class="footer-todo">
            <p id="info"></p>
            <!-- Tombol Hapus Semua sesuai Pertanyaan Analisis No. 3 -->
            <button id="btnHapusSemua" class="hapus-semua">Hapus Semua</button>
        </div>
    </div>
</body>
</html>
